spring:
  application:
    name: genre-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  data:
    mongodb:
      uri: ${MONGODB_URI_SONGS:${MONGODB_URI:mongodb://localhost:27017/repparton_songs}}

server:
  port: ${SERVER_PORT:8091}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.DA2.genreservice: DEBUG