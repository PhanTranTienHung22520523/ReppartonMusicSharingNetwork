spring:
  application:
    name: message-service
  data:
    mongodb:
      uri: ${MONGODB_URI_MESSAGES:${MONGODB_URI:mongodb://localhost:27017/repparton_messages}}

server:
  port: ${SERVER_PORT:8089}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.DA2.messageservice: DEBUG