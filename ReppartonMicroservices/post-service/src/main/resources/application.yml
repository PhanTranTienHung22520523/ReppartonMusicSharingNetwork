server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: post-service
  data:
    mongodb:
      uri: ${MONGODB_URI_POSTS:${MONGODB_URI:mongodb://localhost:27017/repparton_posts}}
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    preferIpAddress: true
    lease-renewal-interval-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
