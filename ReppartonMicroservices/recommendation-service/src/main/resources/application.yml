server:
  port: ${SERVER_PORT:8093}

spring:
  application:
    name: recommendation-service
  cloud:
    discovery:
      enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI_RECOMMENDATIONS:${MONGODB_URI:mongodb://localhost:27017/repparton_recommendations}}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    preferIpAddress: true
    lease-renewal-interval-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
