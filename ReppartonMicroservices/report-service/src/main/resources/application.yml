server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: report-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/reportdb}
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    preferIpAddress: true
    lease-renewal-interval-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Enable debug logging for JWT/shared security to help diagnose auth failures
logging:
  level:
    com.DA2.shared.security: DEBUG
    com.DA2.reportservice: DEBUG
