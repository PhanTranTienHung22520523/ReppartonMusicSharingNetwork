spring:
  application:
    name: story-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:100MB}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/storydb}
  cache:
    type: simple

app:
  upload:
    dir: ${UPLOAD_DIRECTORY:./uploads}

api:
  gateway:
    url: ${API_GATEWAY_URL:http://localhost:8090}

server:
  port: ${SERVER_PORT:8088}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.DA2.storyservice: DEBUG
    org.springframework.cloud: DEBUG